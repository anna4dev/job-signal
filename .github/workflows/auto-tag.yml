name: Auto Tagging

# only run when package.json is changed on main; whether to tag is determined by "version change".
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need full history so github.event.before (pre-push ref) is always reachable.
          fetch-depth: 0

      - name: Detect version change vs push baseline
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$ZERO" ]; then
            echo "has_baseline=false" >> $GITHUB_OUTPUT
            echo "previous=" >> $GITHUB_OUTPUT
            exit 0
          fi

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --prune origin "$BEFORE_SHA" || true
          fi

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "has_baseline=false" >> $GITHUB_OUTPUT
            echo "previous=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_baseline=true" >> $GITHUB_OUTPUT
          PREVIOUS=$(git show "${BEFORE_SHA}:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)
          echo "previous=${PREVIOUS:-}" >> $GITHUB_OUTPUT

      - name: Decide whether to create tag
        id: decide
        run: |
          CUR="${{ steps.version.outputs.current }}"
          PREV="${{ steps.version.outputs.previous }}"
          BASE="${{ steps.version.outputs.has_baseline }}"

          if [ "$BASE" = "true" ] && [ -n "$PREV" ] && [ "$CUR" = "$PREV" ]; then
            echo "should_tag=false" >> $GITHUB_OUTPUT
            echo "Version unchanged vs push baseline ($CUR); skip."
            exit 0
          fi

          echo "should_tag=true" >> $GITHUB_OUTPUT
          echo "Version to tag: v$CUR"

      - name: Check if tag already exists on origin
        id: remote_tag
        if: steps.decide.outputs.should_tag == 'true'
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already on GitHub; skip."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.decide.outputs.should_tag == 'true' && steps.remote_tag.outputs.exists == 'false'
        run: |
          set -e
          TAG="v${{ steps.version.outputs.current }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          if git push origin "refs/tags/$TAG"; then
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag $TAG appeared on origin after push conflict (concurrent run); treating as success."
            exit 0
          fi
          exit 1
