name: Auto Tagging

# 仅在 main 上 package.json 有变动时运行；是否打 tag 再由「version 是否变化」决定。
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "previous=" >> $GITHUB_OUTPUT
            echo "first_commit=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "first_commit=false" >> $GITHUB_OUTPUT
          PREVIOUS=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)
          echo "previous=${PREVIOUS:-}" >> $GITHUB_OUTPUT

      - name: Decide whether to create tag
        id: decide
        run: |
          CUR="${{ steps.version.outputs.current }}"
          PREV="${{ steps.version.outputs.previous }}"
          FIRST="${{ steps.version.outputs.first_commit }}"

          if [ "$FIRST" != "true" ] && [ -n "$PREV" ] && [ "$CUR" = "$PREV" ]; then
            echo "should_tag=false" >> $GITHUB_OUTPUT
            echo "package.json changed but version is still $CUR; skip."
            exit 0
          fi

          echo "should_tag=true" >> $GITHUB_OUTPUT
          echo "Version to tag: v$CUR"

      - name: Check if tag already exists on origin
        id: remote_tag
        if: steps.decide.outputs.should_tag == 'true'
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already on GitHub; skip."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.decide.outputs.should_tag == 'true' && steps.remote_tag.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
